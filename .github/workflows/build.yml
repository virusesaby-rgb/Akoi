name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar proyecto
        run: |
          mkdir -p app/src/main/java/com/akoi/recorder app/src/main/assets app/src/main/res/mipmap-xxxhdpi
          mv app_build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.kt RecorderService.kt app/src/main/java/com/akoi/recorder/
          mv index.html app/src/main/assets/
          mv ic_launcher.png ic_launcher_round.png app/src/main/res/mipmap-xxxhdpi/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Akoi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
